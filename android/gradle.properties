org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false

# 第三方插件（如 home_widget 0.9.0）仍以 JVM target 1.8 编译，而它们依赖的
# androidx / Flutter embedding 已用 11 编译；Kotlin 2.x 默认把「内联更高 target
# 的字节码」判为错误：
#   Cannot inline bytecode built with JVM target 11 into bytecode that is being
#   built with JVM target 1.8
# 降级为警告（与 Flutter issue #146580 给出的 workaround 一致），否则 Android
# 构建在 :home_widget:compileReleaseKotlin 处失败。
kotlin.jvm.target.validation.mode=warning
