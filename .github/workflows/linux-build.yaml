name: 🐧 构建 Linux 应用

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 当推送版本标签时触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            # 固定 ubuntu-22.04（glibc 2.35）以兼容 Ubuntu 22.04 / Debian 12：
            # ubuntu-latest（24.04）产出的 librust_lib_astral.so 会要求
            # GLIBC_2.39，旧发行版启动即报 "version GLIBC_2.39 not found"（#194）。
            runs-on: ubuntu-22.04
            bundle-dir: build/linux/x64/release/bundle
            release-prefix: astral-linux-x64
            artifact-name: astral-linux-x64-all
          - arch: arm64
            # arm64 没有 ubuntu-22.04 runner，继续用 24.04
            runs-on: ubuntu-24.04-arm
            bundle-dir: build/linux/arm64/release/bundle
            release-prefix: astral-linux-arm64
            artifact-name: astral-linux-arm64-all

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      packages: write

    env:
      FLUTTER_VERSION: beta
      FLUTTER_CHANNEL: beta
      RUST_VERSION: 1.89.0
      BUNDLE_DIR: ${{ matrix.bundle-dir }}
      RELEASE_PREFIX: ${{ matrix.release-prefix }}
      ARTIFACT_NAME: ${{ matrix.artifact-name }}

    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 📌 读取应用版本号
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
            VERSION="${VERSION%%+*}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: 🦀 设置 Rust 工具链 ${{ env.RUST_VERSION }}
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_rust.sh
          $GITHUB_WORKSPACE/scripts/install_rust.sh

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgtk-3-dev
          sudo apt-get install -y clang cmake pkg-config libcurl4-openssl-dev
          sudo apt-get install -y protobuf-compiler
          sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y patchelf
          sudo apt-get install -y ruby-dev
          sudo gem install --no-document fpm
          sudo apt-get install -y fuse libfuse2

      - name: 🐦 安装 Flutter
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_flutter.sh
          $GITHUB_WORKSPACE/scripts/install_flutter.sh

      - name: 🎯 启用 Linux 桌面支持
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: 📚 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 🛠️ 构建 Linux 应用 (${{ matrix.arch }})
        run: |
          flutter build linux --release
          ls -la "$BUNDLE_DIR"

      - name: 📦 打包应用
        run: |
          mkdir -p release
          cd "$BUNDLE_DIR"
          patchelf astral --add-needed libisar.so --add-needed librust_lib_astral.so
          tar -czf "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.tar.gz" *
          echo "打包完成，检查文件大小："
          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: 📂 准备打包目录（/usr/bin/astral + 桌面图标 + pixmap）
        run: |
          set -e
          STAGING="$GITHUB_WORKSPACE/build/linux/pkgroot"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/opt/astral"
          # bundle 已在「打包应用」步骤完成 patchelf，这里复制的是最终产物
          cp -a "$BUNDLE_DIR/." "$STAGING/opt/astral/"
          # 恢复 v2.8.5 的安装步骤（v2.8.6 起丢失，导致桌面图标与
          # /usr/bin/astral 缺失，用户只能从终端 sudo 启动，见 #250）：
          #   /usr/bin/astral        -> 包装脚本，exec /opt/astral/astral
          #   /usr/share/applications -> 桌面入口（Exec=/usr/bin/astral）
          #   /usr/share/pixmaps      -> 图标（desktop 里的 Icon=astral）
          install -Dm755 linux/packaging/astral-cli.sh "$STAGING/usr/bin/astral"
          install -Dm644 linux/packaging/astral.desktop "$STAGING/usr/share/applications/astral.desktop"
          install -Dm644 assets/logo.png "$STAGING/usr/share/pixmaps/astral.png"
          ls -l "$STAGING/usr/bin/astral" \
                "$STAGING/usr/share/applications/astral.desktop" \
                "$STAGING/usr/share/pixmaps/astral.png"
          ls "$STAGING/opt/astral"

      - name: 📦 打包 deb 包
        run: |
          set -e
          mkdir -p release
          STAGING="$GITHUB_WORKSPACE/build/linux/pkgroot"
          # --depends 修复 #193：tray_manager 的 Linux 插件硬依赖
          # libayatana-appindicator3.so.1，包内不声明依赖时，干净系统安装后
          # 启动即报 "error while loading shared libraries"。
          # 另补 GTK3 运行库，其余依赖保持最小、交给发行版自动解析。
          fpm -s dir -t deb -n astral -v "${APP_VERSION}" \
            --depends 'libayatana-appindicator3-1' \
            --depends 'libgtk-3-0' \
            -C "$STAGING" .
          mv *.deb "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.deb"

      - name: 📦 打包 rpm 包
        run: |
          set -e
          mkdir -p release
          STAGING="$GITHUB_WORKSPACE/build/linux/pkgroot"
          # rpm 侧优先声明 soname 依赖，跨 Fedora / OpenEuler 更稳（不依赖
          # 发行版包名差异）。注意 rpm 的 soname 依赖后缀随架构变化：
          # x86_64 为 64bit，arm64 为 aarch64。
          if [[ "${RELEASE_PREFIX}" == *arm64* ]]; then
            RPM_ABI="aarch64"
          else
            RPM_ABI="64bit"
          fi
          # 取舍：若目标 fpm 版本对 soname 语法支持有问题，可退回包名
          #   Fedora:   libayatana-appindicator-gtk3
          #   OpenEuler: libayatana-appindicator3-1
          fpm -s dir -t rpm -n astral -v "${APP_VERSION}" \
            --depends "libayatana-appindicator3.so.1()(${RPM_ABI})" \
            --depends 'gtk3' \
            -C "$STAGING" .
          mv *.rpm "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.rpm"

      # 打包产物自检：把「依赖已声明 / 桌面入口与 /usr/bin 已安装 / glibc 上限」
      # 从「希望没问题」变成「构建失败即报警」，避免又出现 #193 那种装完起不来的包。
      #
      # 注意：这里刻意不用 `dpkg-deb -c ... | grep -q` 这类写法——grep -q 命中即退出，
      # 会让上游的 tar 收到 SIGPIPE（tar: stdout: write error），再叠加 `pipefail`
      # 就把「检查通过」误判成失败。统一改成「先整体捕获到变量，再用 case 匹配」。
      - name: ✅ 校验打包结果（依赖 / 桌面入口 / glibc 上限）
        run: |
          set -euo pipefail
          DEB="$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.deb"
          RPMF="$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.rpm"

          DEB_DEPS="$(dpkg-deb -f "$DEB" Depends)"
          DEB_LIST="$(dpkg-deb -c "$DEB")"

          echo "== deb 依赖 =="
          echo "$DEB_DEPS"
          case "$DEB_DEPS" in
            *libayatana-appindicator3-1*) ;;
            *) echo "❌ deb 缺少 libayatana-appindicator3-1 依赖（#193）"; exit 1 ;;
          esac
          case "$DEB_DEPS" in
            *libgtk-3-0*) ;;
            *) echo "❌ deb 缺少 libgtk-3-0 依赖"; exit 1 ;;
          esac

          echo "== deb 载荷（桌面入口 / 包装脚本 / 图标）=="
          case "$DEB_LIST" in
            *./usr/bin/astral*) echo "  ✓ /usr/bin/astral" ;;
            *) echo "❌ deb 缺少 /usr/bin/astral（#250）"; exit 1 ;;
          esac
          case "$DEB_LIST" in
            *./usr/share/applications/astral.desktop*) echo "  ✓ astral.desktop" ;;
            *) echo "❌ deb 缺少桌面入口（#250）"; exit 1 ;;
          esac
          case "$DEB_LIST" in
            *./usr/share/pixmaps/astral.png*) echo "  ✓ astral.png" ;;
            *) echo "❌ deb 缺少图标（#250）"; exit 1 ;;
          esac
          case "$DEB_LIST" in
            *./opt/astral/astral*) echo "  ✓ /opt/astral/astral" ;;
            *) echo "❌ deb 缺少 /opt/astral/astral"; exit 1 ;;
          esac

          echo "== rpm 依赖与载荷 =="
          sudo apt-get install -y rpm > /dev/null 2>&1 || true
          RPM_REQ="$(rpm -qpR "$RPMF" 2>/dev/null || true)"
          RPM_LIST="$(rpm -qlp "$RPMF" 2>/dev/null || true)"
          echo "$RPM_REQ"
          case "$RPM_REQ" in
            *libayatana-appindicator3.so.1*) ;;
            *) echo "❌ rpm 缺少 libayatana-appindicator3 soname 依赖（#193）"; exit 1 ;;
          esac
          case "$RPM_LIST" in
            */usr/bin/astral*) echo "  ✓ rpm /usr/bin/astral" ;;
            *) echo "❌ rpm 缺少 /usr/bin/astral（#250）"; exit 1 ;;
          esac

          # x64 包固定用 ubuntu-22.04 构建（glibc 2.35），避免旧发行版起不来（#194）。
          # arm64 runner 只有 24.04（glibc 2.39），不做该断言。
          if [[ "${RELEASE_PREFIX}" == *x64* ]]; then
            # 用 -print -quit 让 find 自己停，避免 `find | head` 在 pipefail 下
            # 因 SIGPIPE 误判失败。
            RUST_LIB="$(find "$GITHUB_WORKSPACE/build/linux/pkgroot/opt/astral" -name 'librust_lib_astral.so' -print -quit)"
            if [ -n "$RUST_LIB" ]; then
              MAX_GLIBC="$(objdump -T "$RUST_LIB" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
              echo "librust_lib_astral.so 需要的最高 GLIBC 版本: $MAX_GLIBC"
              if [ "$(printf '%s\n2.35\n' "$MAX_GLIBC" | sort -V | tail -1)" != "2.35" ]; then
                echo "❌ 产物需要 GLIBC_$MAX_GLIBC > 2.35，Ubuntu 22.04/Debian 12 无法运行（#194）"
                exit 1
              fi
            else
              echo "⚠️ 未找到 librust_lib_astral.so，跳过 glibc 上限断言"
            fi
          fi
          echo "✅ 打包产物自检通过"

      - name: 📤 上传 Linux 构建产物 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/${{ matrix.release-prefix }}.tar.gz
            release/${{ matrix.release-prefix }}.deb
            release/${{ matrix.release-prefix }}.rpm
          retention-days: 7
