name: 🍏 构建 macOS 应用

# macOS 应用只能在搭载 Xcode 的 macOS 主机上编译（Apple 工具链不开源、不可跨平台）。
# 本工作流在 GitHub 托管的 macOS runner 上完成构建，runner 已预装 Xcode，无需自备 Mac。
#
# 签名策略：
#   未配置 MACOS_CERT_P12 时走 ad-hoc 签名（不需要开发者账号，但过不了 Gatekeeper，
#   用户首次打开需右键→打开，或 xattr -dr com.apple.quarantine）。
#   配置了证书与公证凭据后自动切换为 Developer ID 签名 + 公证。

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本（beta / stable / 具体版本号如 3.35.0）'
        required: false
        default: 'beta'
        type: string
      build_arch:
        description: '目标架构（runner 为 Apple Silicon，默认 arm64）'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
      release_tag:
        description: '发布为 Release 的标签（如 v2.9.60）。留空则只上传 artifact。'
        required: false
        default: ''
        type: string
      snapshot_cache:
        description: '把 Rust 编译产物快照上传为 Release 资产（持久化兜底）。'
        required: false
        default: false
        type: boolean
      cache_bust:
        description: '缓存击穿标记：填任意值可强制冷构建（缓存损坏时的手动逃生口）。'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'
  # 每 6 天自动构建一次，刷新 actions/cache 的访问时间，避免触发 GitHub 的
  # “7 天未访问即回收”策略。公开仓库的 Actions 分钟数免费，成本可忽略。
  schedule:
    - cron: '0 3 */6 * *'

jobs:
  build:
    # macos-14 及以上为 Apple Silicon 且预装 Xcode；指定它以保证架构可预期。
    runs-on: macos-14

    permissions:
      contents: write
      packages: write

    env:
      FLUTTER_VERSION: ${{ github.event.inputs.flutter_version || 'beta' }}
      FLUTTER_CHANNEL: ${{ github.event.inputs.flutter_version || 'beta' }}
      RUST_VERSION: 1.89.0
      BUILD_ARCH: ${{ github.event.inputs.build_arch || 'arm64' }}
      # 让 cargokit 把 cargo 的 --target-dir 指到仓库内的固定路径（可被
      # actions/cache 命中），而不是 Xcode 每次构建都变化的 TARGET_TEMP_DIR。
      # 仓库内 rust/.gitignore 已含 /target，不会误提交。
      CARGOKIT_CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      # 编译产物快照所在的 Release 标签（资产永久保留，不受 7 天回收影响）。
      CACHE_SNAPSHOT_TAG: cache-snapshot
      # 手动触发时用输入值；被打 tag 触发时用该 tag。
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      # runner 自带 Xcode，这里只做断言：确认工具链真的可用，失败就早退，
      # 不要等到几十分钟的 Rust 编译之后才发现。
      - name: 🍎 确认 Xcode 工具链
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          echo "SDK:"
          xcodebuild -showsdks | grep -i macos || true

      - name: 📌 读取应用版本号
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
            VERSION="${VERSION%%+*}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: 🦀 设置 Rust 工具链 ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/scripts/install_rust.sh"
          "$GITHUB_WORKSPACE/scripts/install_rust.sh"
          # rustup 由脚本在子 shell 中安装，其 PATH 不会传回本步骤。
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          # cargokit 会在 Xcode 构建阶段按目标架构调用 cargo，必须预装交叉目标。
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      - name: 📦 安装系统依赖
        run: |
          set -euo pipefail
          # 不要用 `brew update`：它会同步整个 formula 仓库，实测单个步骤就超过
          # 10 分钟。runner 镜像已预装 cmake/ninja/cocoapods，先探测，只补缺的。
          need=()
          for tool in cmake ninja pod protoc; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "已存在: $tool -> $(command -v "$tool")"
            else
              echo "缺失:   $tool"
              need+=("$tool")
            fi
          done

          if ((${#need[@]})); then
            # protoc 由 protobuf 提供，pod 由 cocoapods 提供，其余同名。
            formula=()
            for t in "${need[@]}"; do
              case "$t" in
                protoc) formula+=(protobuf) ;;
                pod)    formula+=(cocoapods) ;;
                *)      formula+=("$t") ;;
              esac
            done
            # 同样跳过隐式更新；formula 索引随 runner 镜像分发，已足够新。
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install --quiet "${formula[@]}"
          else
            echo "所有构建依赖均已预装，跳过 brew install"
          fi

          echo "protoc: $(protoc --version)"
          echo "cocoapods: $(pod --version)"
          echo "cmake: $(cmake --version | head -1)"
          echo "ninja: $(ninja --version)"

      - name: 🐦 安装 Flutter
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/scripts/install_flutter.sh"
          "$GITHUB_WORKSPACE/scripts/install_flutter.sh"
          # 安装脚本是在子 shell 中执行的，它里面的 export PATH 不会传回本步骤。
          # $GITHUB_PATH 也只对后续步骤生效，所以这里必须显式补一次。
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          which flutter
          flutter --version
          flutter config --enable-macos-desktop
          flutter config --no-analytics || true

      - name: 📚 获取 Flutter 依赖
        run: |
          set -euo pipefail
          # $GITHUB_PATH 从下一步起才生效，这里再补一次，避免依赖步骤顺序。
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          flutter precache --macos
          flutter pub get

      - name: 🗄️ 缓存 Cargo 依赖索引
        # 注册表与 git 依赖（easytier 是 git 依赖，体积不小）。这部分命中率高、
        # 体积小，是保险的收益。
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ env.BUILD_ARCH }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ env.BUILD_ARCH }}-

      - name: 🗄️ 缓存 Rust 编译产物
        # 构建耗时几乎全部在这里（实测构建步骤 1095s，其余合计约 112s）。
        #
        # cargokit 默认把 cargo 的 --target-dir 指向 Xcode 的 TARGET_TEMP_DIR，
        # 那在 DerivedData 下、每次构建路径都不同，Cargo 的增量缓存永远冷启动，
        # actions/cache 也无从命中。因此我们在 workflow 里设
        # CARGOKIT_CARGO_TARGET_DIR 指向仓库内的固定路径，并对该路径做缓存。
        # 源码或 Cargo.lock 变化会让 key 失配，退化为 restore-keys 的部分命中
        # （Cargo 仍能复用未受影响的 crate）。
        id: rust-target-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/rust/target
          key: cargo-target-${{ runner.os }}-${{ env.BUILD_ARCH }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/src/**', 'rust/build.rs', 'rust_builder/macos/rust_lib_astral.podspec') }}-${{ github.event.inputs.cache_bust }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ env.BUILD_ARCH }}-${{ env.RUST_VERSION }}-

      - name: 🔁 从 Release 快照恢复编译产物（仅缓存未命中时）
        # actions/cache 会被 GitHub 在“7 天未访问”后回收；Release 资产不会。
        # 只在缓存完全未命中时才下载，避免正常构建白白多传 ~800MB。
        if: steps.rust-target-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if ! gh release view "$CACHE_SNAPSHOT_TAG" >/dev/null 2>&1; then
            echo "无 $CACHE_SNAPSHOT_TAG 快照，走冷构建"
            exit 0
          fi
          ASSETS=$(gh release view "$CACHE_SNAPSHOT_TAG" --json assets \
            --jq '.assets[].name | select(startswith("rust-target.tar.gz"))' || true)
          if [[ -z "$ASSETS" ]]; then
            echo "快照中无 rust-target.tar.gz* 资产，走冷构建"
            exit 0
          fi
          echo "下载快照分卷："; echo "$ASSETS"
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          gh release download "$CACHE_SNAPSHOT_TAG" -p 'rust-target.tar.gz*' -D /tmp/snap --clobber
          ls -lh /tmp/snap
          # 分卷上传时是 rust-target.tar.gz.partNN；未分卷时是单个
          # rust-target.tar.gz。注意 cat 一个不存在的 glob 会返回非零，
          # 所以不能用 `cat ... || cp ...` 这种写法，必须先判断。
          if compgen -G "/tmp/snap/rust-target.tar.gz.part*" > /dev/null; then
            cat /tmp/snap/rust-target.tar.gz.part* > /tmp/rust-target.tar.gz
          else
            cp /tmp/snap/rust-target.tar.gz /tmp/rust-target.tar.gz
          fi
          # 解压到目标目录的上级，因为归档里第一层是 target/。
          TARGET="${CARGOKIT_CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/rust/target}"
          mkdir -p "$(dirname "$TARGET")"
          rm -rf "$TARGET"
          tar -xzf /tmp/rust-target.tar.gz -C "$(dirname "$TARGET")"
          du -sh "$TARGET"
          echo "快照恢复完成"

      - name: 🍫 安装 CocoaPods 依赖
        run: |
          set -euo pipefail
          cd macos
          # 仓库内提交的 Podfile.lock 早于当前 pubspec 依赖集（仍含已移除的
          # sentry/file_picker 等），会与 pod install 解析结果冲突，这里直接重建。
          rm -f Podfile.lock
          pod install --repo-update
          ls -la Pods/ | head -20

      - name: 🛠️ 构建 macOS 应用
        run: |
          set -euo pipefail
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          # 确认 cargokit 真的用了我们指定的稳定 target 目录，否则缓存形同虚设。
          echo "CARGOKIT_CARGO_TARGET_DIR=${CARGOKIT_CARGO_TARGET_DIR:-<unset>}"
          # cargokit 在 Xcode 阶段编译 Rust；失败时输出会很长，持久化日志便于排错。
          # 必须开 pipefail：否则 flutter 失败会被 tee 的成功退出码掩盖，
          # 构建明明挂了却继续往下走。
          set -o pipefail
          flutter build macos --release \
            --build-name="${APP_VERSION}" \
            2>&1 | tee "$GITHUB_WORKSPACE/macos_build.log"

      - name: 📏 报告缓存体积
        # actions/cache 的限制是 10GB，超了整个 job 的保存会失败（只在 post 步骤报警，
        # 很容易被忽略）。这里提前把体积打出来。
        run: |
          set -euo pipefail
          TARGET="${CARGOKIT_CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/rust/target}"
          if [[ -d "$TARGET" ]]; then
            echo "Rust target 目录: $TARGET"
            du -sh "$TARGET"
            du -sh "$TARGET"/* 2>/dev/null | sort -h | tail -5 || true
          else
            echo "::warning::未找到 $TARGET —— cargokit 可能没有使用指定目录，缓存将不会生效"
          fi
          du -sh "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true

      - name: 💾 上传编译产物快照为 Release 资产
        # 持久化兜底：actions/cache 会被 7 天未访问回收，Release 资产不会。
        # 只在定时构建或手动勾选 snapshot_cache 时执行，避免每次构建都多花时间。
        #
        # GitHub 单个 Release 资产上限 2GiB，而 target 未压缩约 2.9GB，因此先
        # tar.gz 再按 1.5GiB 分卷；恢复时按 part 顺序拼接。
        if: ${{ github.event_name == 'schedule' || github.event.inputs.snapshot_cache == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${CARGOKIT_CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/rust/target}"
          [[ -d "$TARGET" ]] || { echo "::warning::无 $TARGET，跳过快照"; exit 0; }

          cd "$(dirname "$TARGET")"
          tar -czf /tmp/rust-target.tar.gz "$(basename "$TARGET")"
          ls -lh /tmp/rust-target.tar.gz

          SPLIT_LIMIT=$((1536 * 1024 * 1024))   # 1.5 GiB，留足 2GiB 上限余量
          SIZE=$(stat -f%z /tmp/rust-target.tar.gz)
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          if (( SIZE > SPLIT_LIMIT )); then
            echo "归档 ${SIZE} 字节超过分卷阈值，分卷上传"
            split -b "$SPLIT_LIMIT" -d -a 2 /tmp/rust-target.tar.gz /tmp/snap/rust-target.tar.gz.part
          else
            cp /tmp/rust-target.tar.gz /tmp/snap/rust-target.tar.gz
          fi
          ls -lh /tmp/snap

          # 首次运行时创建快照 Release；已存在则复用。
          if ! gh release view "$CACHE_SNAPSHOT_TAG" >/dev/null 2>&1; then
            gh release create "$CACHE_SNAPSHOT_TAG" \
              --title "编译产物快照（自动生成，请勿删除）" \
              --notes "本 Release 仅用于持久化 Rust 编译产物，供 macOS 构建在 actions/cache 被回收后快速恢复。由 .github/workflows/macos-build.yaml 自动维护。"
          fi
          gh release upload "$CACHE_SNAPSHOT_TAG" /tmp/snap/* --clobber
          echo "快照已上传"
          gh release view "$CACHE_SNAPSHOT_TAG" --json assets \
            --jq '.assets[] | .name + "  " + (.size|tostring)'

      - name: 🔑 导入签名证书（可选，未配置则跳过）
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" ]]; then
            echo "::notice::未配置 MACOS_CERT_P12，将使用 ad-hoc 签名"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/AstralSigning.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # 让 codesign 在非交互环境下无需再次授权即可使用私钥。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # 保留原有搜索列表，避免破坏 runner 自带 keychain 的查找。
          EXISTING="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: 🖊️ 签名 .app
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/astral.app"
          IDENTITY="${SIGN_IDENTITY:--}"

          if [[ "$IDENTITY" == "-" ]]; then
            # ad-hoc 签名：不需要证书，让 bundle 签名自洽，但**不能**通过
            # Gatekeeper 公证检查，用户下载后仍需右键打开或移除 quarantine。
            codesign --force --deep --sign - "$APP"
            echo "已使用 ad-hoc 签名（无证书）"
          else
            IDENTITY_HASH="$(security find-identity -v -p codesigning | awk -v pat="$IDENTITY" '$0 ~ pat {print $2; exit}')"
            test -n "$IDENTITY_HASH" || { echo "::error::keychain 中找不到 '$IDENTITY' 证书"; security find-identity -v -p codesigning; exit 1; }
            codesign --force --deep --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements \
              --sign "$IDENTITY_HASH" "$APP"
            echo "已使用 Developer ID 签名"
          fi

          echo "=== 签名校验 ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Identifier|TeamIdentifier|Signature|Authority|flags' || true

          echo "=== Gatekeeper 评估（ad-hoc 预期被拒，属正常）==="
          spctl -a -vvv "$APP" 2>&1 || echo "（未通过 Gatekeeper，未签名产物属预期）"

          if [[ "$IDENTITY" != "-" ]]; then
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Authority=Developer ID' \
              || { echo "::error::签名未使用 Developer ID"; exit 1; }
          fi

      - name: 🔎 校验产物
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/astral.app"
          test -d "$APP" || { echo "::error::未找到 $APP"; exit 1; }
          echo "=== bundle 结构 ==="
          ls -la "$APP/Contents"
          echo "=== 主程序架构 ==="
          lipo -info "$APP/Contents/MacOS/astral"
          echo "=== 动态库依赖 ==="
          otool -L "$APP/Contents/MacOS/astral" | head -20
          echo "=== 最低系统版本 ==="
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" || true

      - name: 💿 打包 DMG
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/astral.app"
          mkdir -p release
          # 用临时目录构造 DMG 内容，保证 .app 位于卷根目录。
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # 未签名产物会被 Gatekeeper 拦截，把放行说明一起放进 DMG，
          # 否则用户看到"应用已损坏"时无从下手。
          cp macos/INSTALL.txt "$STAGE/安装说明.txt"

          # UDZO 是压缩格式，事后从 DMG 字节里无法确认内容；这里显式打印
          # staging 目录，让日志本身可审计（缺文件时 cp 在 set -e 下已早退）。
          echo "=== DMG 将包含 ==="
          ls -la "$STAGE"
          test -d "$STAGE/astral.app" || { echo "::error::staging 中缺少 astral.app"; exit 1; }
          test -f "$STAGE/安装说明.txt" || { echo "::error::staging 中缺少 安装说明.txt"; exit 1; }
          test -L "$STAGE/Applications" || { echo "::error::staging 中缺少 Applications 软链"; exit 1; }

          DMG="release/astral-macos-${BUILD_ARCH}.dmg"
          rm -f "$DMG"
          hdiutil create \
            -volname "Astral" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG"
          echo "=== DMG 校验 ==="
          hdiutil verify "$DMG"
          ls -lh "$DMG"

      - name: 📤 上传 DMG 产物
        uses: actions/upload-artifact@v6
        with:
          name: astral-macos-${{ env.BUILD_ARCH }}
          path: release/astral-macos-${{ env.BUILD_ARCH }}.dmg
          if-no-files-found: error
          retention-days: 7

      - name: 📤 上传构建日志
        # 失败时也要能看到完整日志，方便定位 Rust / Xcode 报错。
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-build-log
          path: macos_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 🚀 发布 Release
        # 只有在 workflow_dispatch 传了 release_tag，或由 v* tag 触发时才发布。
        # 注意：tag 触发时 RELEASE_TAG 等于 github.ref_name，形如 v2.9.60；
        # 手动触发且留空时不发布，只保留 artifact。
        if: ${{ github.event_name == 'push' || github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Astral ${{ env.RELEASE_TAG }} (macOS)
          draft: false
          prerelease: false
          body: |
            Astral ${{ env.APP_VERSION }} — macOS 版本

            **架构**：universal（arm64 + x86_64），Intel 与 Apple Silicon 均可原生运行
            **最低系统**：macOS 12.0 (Monterey)

            ## 安装
            1. 下载下方 `astral-macos-${{ env.BUILD_ARCH }}.dmg`
            2. 打开后把 `astral.app` 拖入 Applications
            3. **首次打开**：按住 Control 点击图标 → 选择「打开」→ 再点一次「打开」

            > 本产物未使用 Apple 付费开发者证书签名（ad-hoc），因此 macOS 会拦截首次启动，
            > 提示「无法验证开发者」或「应用已损坏」。这不是文件损坏。
            > 也可执行：`xattr -dr com.apple.quarantine /Applications/astral.app`
            > DMG 内附有《安装说明.txt》。

            ## 构建信息
            由 GitHub Actions 在 `macos-14` runner 上构建，流程见 `.github/workflows/macos-build.yaml`。
          files: |
            release/astral-macos-${{ env.BUILD_ARCH }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
