name: 📱 构建 Android-build-all

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把构建出的 APK 上传到该 Release 标签（留空则仅上传 Actions artifact）'
        required: false
        default: ''
        type: string
  push:  # 每次 push 到仓库时触发
    tags:
      - 'v*'  # 指定触发分支

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保有写入权限
      packages: write
    
    env:
      # 固定版本而不是 beta：beta 是移动分支，会导致 pub 整图重解析，
      # 拉进与 pubspec.lock 不一致的插件版本（与 macOS 构建同一类问题）。
      FLUTTER_VERSION: 3.47.9
      FLUTTER_CHANNEL: beta
      RUST_VERSION: 1.89.0
      NDK_VERSION: 28.2.13676358
      JDK_VERSION: 17
      CMAKE_VERSION: 3.18.1
      # 与 pubspec.lock 中记录的包源保持一致，否则 --enforce-lockfile 必然失败
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    
    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 🦀 设置 Rust 工具链 1.89.0
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_rust.sh
          $GITHUB_WORKSPACE/scripts/install_rust.sh

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev
          sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          sudo apt-get install -y clang llvm libclang-dev
          sudo apt-get install -y libc-dev
          sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
          sudo apt-get install -y protobuf-compiler

      - name: 🎯 配置 Rust 目标架构
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: 🤖 设置 Android SDK
        run: |
          set -euo pipefail
          # 上游原本使用 android-actions/setup-android@v3，该 action 内部会安装
          # 已从 SDK 仓库下架的旧版 "tools" 包，2026-10 起在 runner 上直接失败：
          #   Warning: Failed to find package 'tools'  (sdkmanager exit 1)
          # 这里改用 runner 预装的 SDK 自行安装构建所需组件。
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "找不到 sdkmanager，回退到 which"; SDKMGR="$(which sdkmanager)"
          fi
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "Android SDK 组件就绪"; ls "$ANDROID_HOME"

      - name: 🐦 安装 Flutter
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_flutter.sh
          $GITHUB_WORKSPACE/scripts/install_flutter.sh

      - name: 📚 安装 Flutter 依赖
        run: |
          flutter pub get --enforce-lockfile

      - name: 🦀 安装 cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: 🔧 设置 bindgen 环境变量
        run: |
          set -euo pipefail
          # 交叉编译到 Android 时**绝不能**把宿主机的 /usr/include 塞给 bindgen：
          # 那会让 clang 用 glibc 的 bits/floatn.h 去解析 arm64 目标，直接报
          #   error: __float128 is not supported on this target
          # （上游 CI 在旧 runner 镜像上侥幸能过，2026-10 起镜像更新后必失败。）
          # 正确做法：对每个目标 ABI 单独指定 NDK sysroot 头文件。
          NDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | tail -1)"
          fi
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "NDK_ROOT=$NDK_ROOT"
          echo "SYSROOT=$SYSROOT"
          for abi in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android i686-linux-android; do
            key="BINDGEN_EXTRA_CLANG_ARGS_$(echo "$abi" | tr '.-' '__')"
            echo "${key}=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/$abi" >> "$GITHUB_ENV"
          done
          # armv7 的 rustc target 名是 armv7-linux-androideabi（不是 armv7a-...），单独补一份
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT -I$SYSROOT/usr/include -I$SYSROOT/usr/include/armv7a-linux-androideabi" >> "$GITHUB_ENV"
          # 用 NDK 自带的 libclang，避免宿主机 libclang 版本与 NDK 头文件不匹配
          if [ -d "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib64" ]; then
            echo "LIBCLANG_PATH=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib64" >> "$GITHUB_ENV"
          else
            echo "LIBCLANG_PATH=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib" >> "$GITHUB_ENV"
          fi

      - name: 🔐 设置签名配置
        run: |
          set -euo pipefail
          # 发版仓库用 secrets 里的正式签名；fork/PR 环境没有 secrets 时，
          # 生成一份一次性调试签名，仅用于「能编译出 APK」的构建验证。
          # 注意：一次性签名不能用于覆盖安装（签名不同会安装失败）。
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "使用仓库 secrets 中的正式签名配置"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > android/key.properties
          else
            echo "未提供签名 secrets（fork/PR 环境）：生成一次性调试签名，仅用于构建验证"
            keytool -genkeypair -v \
              -keystore android/app/ci-verify.jks \
              -storepass astralci -keypass astralci \
              -alias astralci -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Astral CI Verify, OU=CI, O=Astral, L=NA, ST=NA, C=CN" > /dev/null 2>&1
            {
              echo "storeFile=ci-verify.jks"
              echo "keyAlias=astralci"
              echo "storePassword=astralci"
              echo "keyPassword=astralci"
            } > android/key.properties
          fi
          echo "检查 key.properties 是否创建成功:"
          ls -la android/key.properties

      - name: 🛠️ 构建 universal APK
        run: |
          # 清理之前的构建产物
          flutter clean
          cd rust && cargo clean && cd ..
          
          # 构建全架构 APK
          flutter build apk --release

      - name: 📤 上传全架构 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astral-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 由 runner 直接把 APK 挂到 Release：避免在本地/弱网环境下下载 30MB+ 的
      # artifact 再上传（实际踩过 gh run download 长时间卡住的情况）。
      - name: 🚀 上传 APK 到 Release（可选）
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "/tmp/astral-universal.apk"
          ls -l "/tmp/astral-universal.apk"
          gh release upload "${{ inputs.release_tag }}" "/tmp/astral-universal.apk" --clobber
